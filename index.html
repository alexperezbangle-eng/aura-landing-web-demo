<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA Hotel & Spa — Barcelona</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #C4A265;
    --gold-light: #DFC89A;
    --cream: #F5F0E8;
    --dark: #1A1A18;
    --dark-overlay: rgba(18, 18, 16, 0.55);
  }

  html, body {
    height: 100%;
    font-family: 'Jost', sans-serif;
    background: var(--dark);
    color: var(--cream);
    overflow-x: hidden;
  }

  /* ── Full-screen hero ── */
  .hero {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 1.5rem;
  }

  /* Backdrop – warm Mediterranean hotel vibe via gradient layers */
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 120% 80% at 50% 30%, rgba(196,162,101,0.18) 0%, transparent 70%),
      radial-gradient(ellipse 100% 100% at 80% 90%, rgba(62,78,56,0.35) 0%, transparent 60%),
      linear-gradient(175deg, #2C2B24 0%, #1A1A18 40%, #0F1210 100%);
    z-index: 0;
  }

  /* Subtle texture grain */
  .hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 200px;
    opacity: 0.5;
    z-index: 0;
    pointer-events: none;
  }

  .hero > * { position: relative; z-index: 1; }

  /* ── Decorative top line ── */
  .ornament {
    width: 48px;
    height: 1px;
    background: var(--gold);
    margin-bottom: 2.5rem;
    animation: fadeDown 1s ease both 0.3s;
  }

  /* ── Logo / Brand ── */
  .logo-mark {
    margin-bottom: 1rem;
    animation: fadeDown 1s ease both 0.5s;
  }
  .logo-mark svg {
    width: 56px;
    height: 56px;
  }

  .brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(3.5rem, 8vw, 7rem);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--cream);
    line-height: 1;
    margin-bottom: 0.15em;
    animation: fadeDown 1s ease both 0.7s;
  }

  .brand-tagline {
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: clamp(0.7rem, 1.6vw, 0.95rem);
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 3rem;
    animation: fadeDown 1s ease both 0.9s;
  }

  /* ── Divider ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 2.5rem;
    animation: fadeDown 1s ease both 1s;
  }
  .divider span {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
  }
  .divider .diamond {
    width: 6px;
    height: 6px;
    background: var(--gold);
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  /* ── QR section ── */
  .qr-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeUp 1s ease both 1.2s;
  }

  .qr-label {
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold-light);
    margin-bottom: 1.5rem;
  }

  .qr-frame {
    position: relative;
    padding: 20px;
    background: var(--cream);
    border-radius: 4px;
    box-shadow:
      0 0 0 1px var(--gold-light),
      0 20px 60px rgba(0,0,0,0.4),
      0 0 80px rgba(196,162,101,0.08);
  }

  .qr-frame canvas {
    display: block;
    width: 180px !important;
    height: 180px !important;
  }

  /* Corner accents on QR frame */
  .qr-frame::before,
  .qr-frame::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    border-color: var(--gold);
    border-style: solid;
  }
  .qr-frame::before {
    top: -4px; left: -4px;
    border-width: 1px 0 0 1px;
  }
  .qr-frame::after {
    bottom: -4px; right: -4px;
    border-width: 0 1px 1px 0;
  }

  .qr-hint {
    margin-top: 1.5rem;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 1rem;
    color: rgba(245,240,232,0.5);
    letter-spacing: 0.05em;
  }

  .portal-btn {
    display: inline-block;
    margin-top: 2rem;
    padding: 0.85rem 2.8rem;
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    font-size: 0.78rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--cream);
    border: 1px solid var(--gold);
    border-radius: 2px;
    background: transparent;
    transition: background 0.4s ease, color 0.4s ease;
    cursor: pointer;
  }
  .portal-btn:hover {
    background: var(--gold);
    color: var(--dark);
  }

  /* ── Location footer ── */
  .location {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.7rem;
    font-weight: 300;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(245,240,232,0.3);
    z-index: 1;
    animation: fadeUp 1s ease both 1.5s;
  }

  /* ── Animations ── */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<section class="hero">

  <div class="ornament"></div>

  <div class="logo-mark">
    <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="28" cy="28" r="27" stroke="#C4A265" stroke-width="0.5"/>
      <circle cx="28" cy="28" r="20" stroke="#C4A265" stroke-width="0.3"/>
      <!-- Leaf / organic mark -->
      <path d="M28 12 C20 20, 20 36, 28 44 C36 36, 36 20, 28 12Z" fill="none" stroke="#C4A265" stroke-width="0.7"/>
      <path d="M28 18 L28 38" stroke="#C4A265" stroke-width="0.4"/>
      <path d="M24 24 L28 28 L24 32" stroke="#C4A265" stroke-width="0.3" fill="none"/>
      <path d="M32 24 L28 28 L32 32" stroke="#C4A265" stroke-width="0.3" fill="none"/>
    </svg>
  </div>

  <h1 class="brand-name">Aura</h1>
  <p class="brand-tagline">Hotel &amp; Spa · Barcelona</p>

  <div class="divider">
    <span></span>
    <div class="diamond"></div>
    <span></span>
  </div>

  <div class="qr-section">
    <p class="qr-label">Accede a tu portal de huésped</p>
    <div class="qr-frame">
      <canvas id="qr"></canvas>
    </div>
    <p class="qr-hint">Escanea para comenzar tu experiencia</p>
    <a href="https://orgfarm-1b1d2217c6-dev-ed.develop.my.site.com/s/" target="_blank" rel="noopener" class="portal-btn">Acceder al portal</a>
  </div>

  <p class="location">Passeig de Gràcia · Barcelona</p>

</section>

<!-- Lightweight QR generator (qrcode-generator, MIT) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
  const url = 'https://orgfarm-1b1d2217c6-dev-ed.develop.my.site.com/s/';
  const qr  = qrcode(0, 'M');
  qr.addData(url);
  qr.make();

  const canvas = document.getElementById('qr');
  const size   = 360;          // 2× for retina
  canvas.width  = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const count = qr.getModuleCount();
  const cell  = size / count;

  ctx.fillStyle = '#F5F0E8';   // cream background
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#1A1A18';   // dark modules

  for (let r = 0; r < count; r++) {
    for (let c = 0; c < count; c++) {
      if (qr.isDark(r, c)) {
        ctx.fillRect(c * cell, r * cell, cell + 0.5, cell + 0.5);
      }
    }
  }
</script>
</body>
</html>
